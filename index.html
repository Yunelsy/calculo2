<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cálculo — Exercícios resolvidos</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet"/><style>:root{--dark:#043c7c;--light:#0494d4}*{box-sizing:border-box}body{font-family:"EB Garamond",Georgia,serif;font-size:clamp(17px,1.2vw + 13px,20px);line-height:1.55;color:#1a1a1a;margin:0;background:#fff}.topbar{background:linear-gradient(100deg,var(--dark) 0%,#0a4d99 40%,var(--light) 100%);color:#fff;text-align:center;padding:34px 16px 26px}.topbar .t1{font-family:"Open Sans",sans-serif;font-weight:700;font-size:26px;letter-spacing:.5px;text-transform:uppercase}.topbar .t2{font-family:"Open Sans",sans-serif;font-weight:600;font-size:17px;margin-top:6px;opacity:.95}.topbar .t3{font-family:"Open Sans",sans-serif;font-weight:600;font-size:14px;margin-top:14px;opacity:.9}main{max-width:900px;margin:0 auto;padding:28px clamp(14px,4vw,32px) 60px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:640px){.cards{grid-template-columns:1fr}}a.card{display:block;text-decoration:none;color:var(--dark);border:2px solid var(--light);border-radius:14px;padding:22px 20px;background:#fff}a.card:hover{background:#eef5fb}.card .h{font-family:"Open Sans",sans-serif;font-weight:700;font-size:22px}.card .d{margin-top:6px;color:#333}.card .tag{display:inline-block;margin-top:12px;font-family:"Open Sans",sans-serif;font-weight:600;font-size:13px;border:1.5px solid var(--light);border-radius:14px;padding:3px 12px}.card .tag.soon{color:#555;border-color:#aaa}.soonbox{text-align:center;border:2px dashed var(--light);border-radius:14px;padding:36px 18px;background:#f6fafd}.soonbox .h{font-family:"Open Sans",sans-serif;font-weight:700;font-size:24px;color:var(--dark)}.back{font-family:"Open Sans",sans-serif;font-weight:600;font-size:14.5px;display:inline-block;margin-top:22px;color:var(--dark);text-decoration:none;border:1.5px solid var(--light);border-radius:16px;padding:5px 14px}.back:hover{background:var(--light);color:#fff}</style></head><body>
